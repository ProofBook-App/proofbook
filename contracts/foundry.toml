[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"

solc_version = "0.8.36"
evm_version = "osaka"
network = "monad"   # Monad gas model, opcode pricing and 128 KB size limit (Foundry >= 1.8)
optimizer = true
optimizer_runs = 200

# Sourcify / MonadVision verification
bytecode_hash = "none"   # Foundry >= 1.8 name for the old metadata_hash = "none"
use_literal_content = true

remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "forge-std/=lib/forge-std/src/",
]

fs_permissions = [{ access = "read", path = "./" }]

[fuzz]
runs = 512

[invariant]
runs = 256
depth = 64
fail_on_revert = false

[profile.ci.fuzz]
runs = 4096

[profile.ci.invariant]
runs = 1024
depth = 128

[rpc_endpoints]
monad = "${MONAD_RPC_URL}"
monad_testnet = "https://testnet-rpc.monad.xyz"

[etherscan]
monad = { key = "${ETHERSCAN_API_KEY}", chain = 143, url = "https://api.etherscan.io/v2/api?chainid=143" }

[fmt]
line_length = 120
