# Proofbook leaderboard, derived from events only (spec §6 invariant 7).
# Amounts are in the vault asset's base units (AUSD and USDC: 6 decimals).
# Share prices are WAD (1e18 = one asset unit per asset unit deposited); vault shares have 12 decimals.

enum AdapterKind {
  Unknown
  Perpl
  Kuru
}

enum FlowKind {
  Deposit
  Withdraw
  Fee
}

# What an AgentVault.execute did, from the adapter event earlier in the same tx.
# Only Order, Buy and Sell are trades; margin moves and cancels are executes that aren't.
enum ExecuteKind {
  Order
  Cancel
  MarginIn
  MarginOut
  Buy
  Sell
  Unknown
}

enum PolicyKind {
  DailyLossBreach
  Frozen
  Unfrozen
  SessionKeyRotated
}

type Agent {
  id: ID! # ERC-8004 agent id
  owner: String!
  maxTradeNotional: BigInt!
  dailyLossCapBps: Int!
  depositCapPerBacker: BigInt!
  venues: [String!]!
  vault: Vault
  registeredAt: Int!
  registeredTx: String!
}

type Vault {
  id: ID! # vault address
  agent: Agent!
  asset: String!
  sessionKey: String!
  frozen: Boolean!
  # NAV as of the last event: the last Executed navAfter, moved by flows since.
  # Mark-to-market moves between trades show up at the next execute.
  nav: BigInt!
  totalShares: BigInt!
  sharePrice: BigInt!
  peakSharePrice: BigInt!
  maxDrawdownBps: Int!
  deposited: BigInt!
  withdrawn: BigInt!
  feesPaid: BigInt!
  # nav + withdrawn + feesPaid - deposited: what trading made or lost for backers, before fees.
  pnl: BigInt!
  highWaterMark: BigInt! # raw AgentVault units (assets * 1e18 / shares): 1e12 is 1.0
  dayStart: Int!
  dayStartNav: BigInt!
  tradeCount: Int! # executes that were orders (Perpl) or buys/sells (Kuru)
  tradeVolume: BigInt! # notional of those
  executeCount: Int! # every execute, including margin moves and cancels
  breachCount: Int!
  freezeCount: Int!
  backerCount: Int!
  createdAt: Int!
  updatedAt: Int!
  backers: [Backer!]! @derivedFrom(field: "vault")
  trades: [Trade!]! @derivedFrom(field: "vault")
  flows: [Flow!]! @derivedFrom(field: "vault")
  policyEvents: [PolicyEvent!]! @derivedFrom(field: "vault")
  navPoints: [NavPoint!]! @derivedFrom(field: "vault")
  adapters: [Adapter!]! @derivedFrom(field: "vault")
}

type Backer {
  id: ID! # vault-account
  vault: Vault!
  account: String! @index
  shares: BigInt!
  deposited: BigInt!
  withdrawn: BigInt!
  firstSeenAt: Int!
}

# One per AgentVault.Executed. `kind` says whether it was a trade (see ExecuteKind).
type Trade {
  id: ID! # chainId-block-logIndex
  vault: Vault!
  kind: ExecuteKind!
  venue: String!
  notional: BigInt!
  venueDelta: BigInt!
  navBefore: BigInt!
  navAfter: BigInt!
  timestamp: Int!
  block: Int!
  txHash: String! @index
}

type Flow {
  id: ID!
  vault: Vault!
  kind: FlowKind!
  account: String!
  assets: BigInt!
  shares: BigInt!
  timestamp: Int!
  txHash: String!
}

type PolicyEvent {
  id: ID!
  vault: Vault!
  kind: PolicyKind!
  by: String
  nav: BigInt
  dayStartNav: BigInt
  timestamp: Int!
  txHash: String!
}

# Share-price history for charts and drawdown: one point per event that moves NAV.
type NavPoint {
  id: ID!
  vault: Vault!
  nav: BigInt!
  sharePrice: BigInt!
  timestamp: Int!
  block: Int!
}

type Adapter {
  id: ID! # adapter address
  kind: AdapterKind!
  vault: Vault
  perplAccountId: BigInt
  perplMarginIn: BigInt!
  perplMarginOut: BigInt!
  perplOrderCount: Int!
  kuruBaseHeld: BigInt! # native MON wei bought minus sold
  kuruQuoteIn: BigInt!
  kuruQuoteOut: BigInt!
  fills: [VenueAction!]! @derivedFrom(field: "adapter")
}

# One per adapter event: Perpl OrderSent/Margin*/Recalled, Kuru Bought/Sold/Unwound.
type VenueAction {
  id: ID!
  adapter: Adapter!
  vault: String!
  kind: String!
  perpId: BigInt
  orderType: Int
  orderId: BigInt
  price: BigInt # Perpl pricePNS, or Kuru reference price (WAD)
  size: BigInt # Perpl lotLNS, or Kuru base wei
  quote: BigInt # asset units in or out (notional, margin, quote)
  leverageHdths: BigInt
  timestamp: Int!
  txHash: String! @index
}

type Asset {
  id: ID! # token address, allowlisted by the registry
  allowedAt: Int!
}

# ------------------------------------------------------------------ Perpl Exchange
# Raw Perpl units: prices PNS (perp priceDecimals), lots LNS (perp lotDecimals), collateral CNS (AUSD, 6 dp).

enum PositionSide {
  None
  Long
  Short
}

enum FillRole {
  Taker
  Maker
}

# A perp one of our adapters has traded.
type Perp {
  id: ID! # Perpl perpId
  # CNS per (PNS x LNS) = 10^scaleExp, i.e. 6 - priceDecimals - lotDecimals. Learned from the first
  # OrderSent (notional / (price x lot), rounded to a power of ten); null until then.
  scaleExp: Int
  markPrice: BigInt
  markUpdatedAt: Int
}

# A Perpl account owned by one of our PerplAdapters.
type PerplAccount {
  id: ID! # Perpl accountId
  adapter: Adapter!
  vault: Vault!
  realisedPnl: BigInt! # sum of deltaPnlCNS on decreases, closes, inversions, liquidations, deleverages
  funding: BigInt! # sum of fundingCNS on the same events
  fees: BigInt! # taker + maker feeCNS
  fillCount: Int!
  volume: BigInt! # fill notional in CNS, where the perp's scale is known
  lastFill: String # id of the latest PerplFill, so OrderSent can price a first fill
  positions: [PerplPosition!]! @derivedFrom(field: "account")
  fills: [PerplFill!]! @derivedFrom(field: "account")
  changes: [PerplPositionChange!]! @derivedFrom(field: "account")
}

type PerplPosition {
  id: ID! # accountId-perpId
  account: PerplAccount!
  vault: String! @index
  perp: Perp!
  perpId: String! @index # for MarkUpdated to find the positions it reprices
  side: PositionSide!
  lot: BigInt!
  entryPrice: BigInt! # lot-weighted average of the fills that built the position
  deposit: BigInt!
  leverageHdths: BigInt!
  realisedPnl: BigInt!
  funding: BigInt!
  # At the last MarkUpdated; null until the perp's scale is known.
  notional: BigInt
  unrealisedPnl: BigInt
  openedAt: Int!
  updatedAt: Int!
}

type PerplFill {
  id: ID!
  account: PerplAccount!
  vault: String! @index
  perp: Perp
  role: FillRole!
  price: BigInt!
  lot: BigInt!
  fee: BigInt!
  notional: BigInt
  orderId: BigInt
  timestamp: Int!
  txHash: String! @index
}

# One per Perpl position event on our accounts.
type PerplPositionChange {
  id: ID!
  account: PerplAccount!
  vault: String! @index
  perp: Perp!
  kind: String! # Opened, Increased, Decreased, Closed, Inverted, Liquidated, Deleveraged, Unwound, UnwoundWithoutPayment
  side: PositionSide!
  price: BigInt
  lotBefore: BigInt!
  lotAfter: BigInt!
  depositAfter: BigInt
  deltaPnl: BigInt
  funding: BigInt
  timestamp: Int!
  txHash: String!
}

# Links a tx to the account whose position it changed, so the TakerOrderFilledV2 that follows in the
# same tx (it carries no accountId) can be attributed. Verified order on testnet: position event, then taker fill.
type PerplTxAccount {
  id: ID! # tx hash
  account: PerplAccount!
  perp: Perp!
}
