# yaml-language-server: $schema=./node_modules/envio/evm.schema.json
name: proofbook
description: Proofbook leaderboard. Agents, vaults, trades, policy events and backers, from events only (spec §6 invariant 7).
disable_default_cross_chain: true
field_selection:
  transaction_fields:
    - hash
contracts:
  # Mints the canonical adapters a registry accepts (security review C1). Registries deployed before
  # 2026-10-03 have none.
  - name: AdapterFactory
    abi_file_path: abis/AdapterFactory.json
    events:
      - event: RegistrySet
      - event: AdapterDeployed
  - name: AgentRegistry
    abi_file_path: abis/AgentRegistry.json
    events:
      - event: AssetAllowed
      - event: AgentRegistered
      - event: VaultLinked
  # One per agent, registered from VaultLinked.
  - name: AgentVault
    abi_file_path: abis/AgentVault.json
    events:
      - event: Deposit
      - event: Withdraw
      - event: Transfer
      - event: Executed
      - event: PolicyBreach
      - event: Frozen
      - event: Unfrozen
      - event: FeeTaken
      - event: HighWaterMarkSet
      - event: SessionKeyRotated
      - event: DayRolled
  # PerplAdapter and KuruAdapter events, registered from AgentRegistered's envelope.venues.
  - name: VenueAdapter
    abi_file_path: abis/VenueAdapter.json
    events:
      - event: Bound
      - event: MarginDeposited
      - event: MarginWithdrawn
      - event: Recalled
      - event: PerpTracked
      - event: OrderSent
      - event: Bought
      - event: Sold
      - event: Unwound
  # Perpl Exchange. Its events have no indexed fields, so every log of these types is fetched and the handlers
  # keep only accounts our PerplAdapters own (PerplAccount, from MarginDeposited). OrderRequestV2 and the
  # order-book events are left out: they are ~90% of the Exchange's logs. ABI subset from PerplFoundation/dex-sdk
  # (MIT) crates/sdk/abi/dex/Exchange.json @ 01b9910 (contract rc_v1.1.7).
  - name: PerplExchange
    abi_file_path: abis/PerplExchange.json
    events:
      - event: MarkUpdated
      - event: TakerOrderFilledV2
      - event: MakerOrderFilledV2
      - event: PositionOpenedV2
      - event: PositionIncreasedV2
      - event: PositionDecreased
      - event: PositionClosed
      - event: PositionInverted
      - event: PositionLiquidated
      - event: PositionDeleveragedV2
      - event: PositionUnwoundV2
      - event: PositionUnwoundWithoutPaymentV2
chains:
  # Monad testnet, real Perpl testnet. Registry 0x25D4…8ABC (block 66759038, no factory, house agent #1951),
  # then factory 0xbe37…359f and registry 0x551f…DA4d with the security fixes but L3 (block 68020887), then
  # factory 0x369E…a481 and registry 0xD791…b6cD with all of them (block 68146772, house agent #2000), 2026-10-04.
  - id: 10143
    start_block: 66759038
    # Data source: HyperSync (https://10143.hypersync.xyz), needs ENVIO_API_TOKEN in indexer/.env.
    contracts:
      - name: AdapterFactory
        address:
          - 0xbe37764D6e2Ea535744C851A8133eb8Fef2C359f
          - 0x369E379c963128C7a51ddA24CB8ec80DfBe0a481
      - name: AgentRegistry
        address:
          - 0x25D4934840Ce6fFE1a1b0bbb7814aDB5623a8ABC
          - 0x551fAE9567d5b66Bca89222732B9086eDB95DA4d
          - 0xD791Bd907Ee2a1B327DB92a21660e118EDe5b6cD
      - name: AgentVault
      - name: VenueAdapter
      - name: PerplExchange
        address:
          - 0x1964C32f0bE608E7D29302AFF5E61268E72080cc
        # No contract start_block: Envio's test indexer refuses any range starting past one, and the handlers
        # already drop accounts that aren't ours. The first of ours opened at 66916943 (tx 0x59c5…ea92).
